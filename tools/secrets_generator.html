<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secrets Codec — ATK Cargo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 /* ============ Tokens ============ */
    :root {
 --bg: #f5f2ea;
 --surface: #ffffff;
 --surface-2: #eeeae0;
 --ink: #1a1a17;
 --ink-muted: #726d61;
 --border: #ddd6c7;
 --accent: #a6501f;
 --accent-ink: #fdf8f0;
 --accent-soft: #f0dcc4;
 --success: #2e6b45;
 --success-soft: #dcead9;
 --danger: #a8342a;
 --danger-soft: #f3dcd8;
 --code-bg: #16140f;
 --code-ink: #e9e2d3;
 --code-border: #2c2820;
 --focus: #a6501f;
 --shadow: none;
    }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
 --bg: #17150f;
 --surface: #201d16;
 --surface-2: #2a261c;
 --ink: #f1ece0;
 --ink-muted: #a29a86;
 --border: #383222;
 --accent: #e08a4b;
 --accent-ink: #1a1207;
 --accent-soft: #3e2c17;
 --success: #6fbf8e;
 --success-soft: #223a2b;
 --danger: #e2857c;
 --danger-soft: #3d2320;
 --code-bg: #0d0c09;
 --code-ink: #e9e2d3;
 --code-border: #2c2820;
        }
    }

    :root[data-theme="dark"] {
 --bg: #17150f;
 --surface: #201d16;
 --surface-2: #2a261c;
 --ink: #f1ece0;
 --ink-muted: #a29a86;
 --border: #383222;
 --accent: #e08a4b;
 --accent-ink: #1a1207;
 --accent-soft: #3e2c17;
 --success: #6fbf8e;
 --success-soft: #223a2b;
 --danger: #e2857c;
 --danger-soft: #3d2320;
 --code-bg: #0d0c09;
 --code-ink: #e9e2d3;
 --code-border: #2c2820;
    }

 * { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: light dark; }

    body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    button, input { font-family: inherit; }

    .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }

    .fa { font-family: 'Vazirmatn', 'Manrope', sans-serif; direction: rtl; }

    svg.icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

 /* ============ Top bar ============ */
    header {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 0.9rem 1.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        flex-wrap: wrap;
        position: sticky;
        top: 0;
        z-index: 20;
    }

    .brand { display: flex; align-items: center; gap: 0.85rem; }

    .brand-mark {
        width: 38px;
        height: 38px;
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .brand-mark svg { width: 20px; height: 20px; stroke: var(--accent-ink); }

    .brand-text h1 {
        font-size: 1.02rem;
        font-weight: 800;
        letter-spacing: -0.01em;
    }

    .brand-text p {
        font-size: 0.76rem;
        color: var(--ink-muted);
        margin-top: 1px;
    }

    .header-controls { display: flex; align-items: center; gap: 0.6rem; }

    .key-field {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.4rem 0.7rem;
    }

    .key-field label {
        font-size: 0.72rem;
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .key-field input {
        width: 52px;
        background: transparent;
        border: none;
        color: var(--accent);
        font-weight: 600;
        font-size: 0.92rem;
        text-align: center;
        outline: none;
    }

 /* ============ Buttons ============ */
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.5rem 0.85rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
        white-space: nowrap;
    }
    .btn:hover { background: var(--surface-2); }
    .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .btn-solid {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
    }
    .btn-solid:hover { filter: brightness(1.06); background: var(--accent); }

    .btn-danger {
        color: var(--danger);
        border-color: var(--danger);
        background: transparent;
    }
    .btn-danger:hover { background: var(--danger-soft); }

    .btn-icon {
        padding: 0.42rem;
        width: 32px;
        height: 32px;
        justify-content: center;
    }

    .btn-danger-tiny {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink-muted);
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    .btn-danger-tiny:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

 #fileInput { display: none; }

 /* ============ Layout ============ */
    .notice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        background: var(--success-soft);
        color: var(--success);
        border-bottom: 1px solid var(--border);
        padding: 0.55rem 1.75rem;
        font-size: 0.78rem;
        font-weight: 500;
    }
    .notice-text { display: flex; align-items: center; gap: 0.5rem; }
    .notice button {
        background: transparent;
        border: none;
        color: inherit;
        font-size: 0.76rem;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
    }

    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.7rem;
        padding: 0.9rem 1.75rem;
        border-bottom: 1px solid var(--border);
    }
    .toolbar-group { display: flex; gap: 0.55rem; flex-wrap: wrap; }

    main {
        flex: 1;
        padding: 1.5rem 1.75rem 2.5rem;
        max-width: 1560px;
        margin: 0 auto;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 1.5rem;
        align-items: start;
    }
    @media (max-width: 1050px) {
        main { grid-template-columns: 1fr; }
    }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.1rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
    }

    .panel-title {
        font-size: 0.86rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .chip {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.16rem 0.5rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        letter-spacing: 0.01em;
    }

    .chip-muted {
        background: var(--surface);
        color: var(--ink-muted);
        border: 1px solid var(--border);
    }

 /* ============ Field list ============ */
    .field-list {
        display: flex;
        flex-direction: column;
        max-height: 68vh;
        overflow-y: auto;
    }
    .field-list::-webkit-scrollbar { width: 8px; }
    .field-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .empty {
        text-align: center;
        padding: 3.5rem 1.75rem;
        color: var(--ink-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
    }
    .empty svg { width: 34px; height: 34px; opacity: 0.5; }
    .empty h3 { color: var(--ink); font-size: 0.95rem; font-weight: 700; }
    .empty p { font-size: 0.82rem; max-width: 30ch; line-height: 1.5; }
    .empty .empty-actions { display: flex; gap: 0.55rem; margin-top: 0.3rem; }

    .field-row {
        padding: 0.9rem 1.1rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .field-row:last-child { border-bottom: none; }

    .field-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
    }
    .field-name {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--ink);
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
    }
    .field-index { color: var(--ink-muted); font-weight: 500; }

    .field-labels {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.76rem;
    }
    .field-label-en { color: var(--ink-muted); }
    .field-label-fa { color: var(--accent); font-weight: 500; }

    .field-input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 0.55rem 0.7rem;
        color: var(--ink);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.82rem;
        outline: none;
        transition: border-color 0.12s;
    }
    .field-input:focus { border-color: var(--focus); }

 /* ============ Code panel ============ */
    .code-panel { position: sticky; top: 4.4rem; }

    .code-scroll {
        background: var(--code-bg);
        max-height: 68vh;
        overflow: auto;
    }
    .code-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .code-scroll::-webkit-scrollbar-thumb { background: var(--code-border); border-radius: 4px; }

    pre {
        padding: 1.15rem 1.25rem;
        color: var(--code-ink);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.79rem;
        line-height: 1.65;
        white-space: pre;
    }

 /* ============ Modal ============ */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 9, 6, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: 92%;
        max-width: 760px;
        display: flex;
        flex-direction: column;
    }
    .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 0.92rem; font-weight: 700; }
    .modal-body { padding: 1.1rem 1.25rem; }
    .modal-body textarea {
        width: 100%;
        height: 280px;
        background: var(--code-bg);
        color: var(--code-ink);
        border: 1px solid var(--code-border);
        border-radius: 8px;
        padding: 0.9rem;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.8rem;
        outline: none;
        resize: none;
    }
    .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--border);
    }

 /* ============ Toast ============ */
    .toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translate(-50%, 12px);
        background: var(--ink);
        color: var(--bg);
        padding: 0.65rem 1.1rem;
        border-radius: 8px;
        font-size: 0.82rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: transform 0.18s, opacity 0.18s;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg>
        </div>
        <div class="brand-text">
            <h1>Secrets Codec</h1>
            <p>XOR encoder / decoder for <span class="mono">secrets.cpp</span></p>
        </div>
    </div>

    <div class="header-controls">
        <div class="key-field">
            <label>XOR key</label>
            <input type="text" id="xorKey" class="mono" value="0x5A" maxlength="4" onchange="generateCppCode()">
        </div>
        <button class="btn btn-icon" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
            <svg class="icon" id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn btn-solid" onclick="addCustomSecret()">
            <svg class="icon" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
            Add field
        </button>
    </div>
</header>

<div class="notice">
    <div class="notice-text">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z"/></svg>
        Everything runs locally in this tab — decoding, editing, and code generation never leave your browser.
    </div>
    <button onclick="wipeMemory()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        Clear memory
    </button>
</div>

<div class="toolbar">
    <div class="toolbar-group">
        <button class="btn" onclick="document.getElementById('fileInput').click()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>
            Upload secrets.cpp
        </button>
        <button class="btn" onclick="openPasteModal()">
            <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="1.5"/><path d="M9 2h6v3H9z"/></svg>
            Paste source
        </button>
        <input type="file" id="fileInput" accept=".cpp,.txt,.h,.c" onchange="handleFileUpload(event)">
        <button class="btn" onclick="loadDefaultSecrets()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
            Load ATK Cargo defaults
        </button>
    </div>
    <div class="toolbar-group">
        <button class="btn btn-danger" onclick="clearAllSecrets()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
            Clear form
        </button>
    </div>
</div>

<main>
    <section class="panel">
        <div class="panel-head">
            <div class="panel-title">
                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
                Fields
            </div>
            <span class="chip chip-muted" id="secretsCount">0 fields</span>
        </div>
        <div class="field-list" id="secretsForm"></div>
    </section>

    <section class="panel code-panel">
        <div class="panel-head">
            <div class="panel-title">
                <svg class="icon" viewBox="0 0 24 24"><path d="M8 4 2 12l6 8M16 4l6 8-6 8M14 3l-4 18"/></svg>
                secrets.cpp output
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn" onclick="copyCode()">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
                    Copy
                </button>
                <button class="btn btn-solid" onclick="downloadCppFile()">
                    <svg class="icon" viewBox="0 0 24 24" stroke="var(--accent-ink)"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                    Download
                </button>
            </div>
        </div>
        <div class="code-scroll">
            <pre id="cppOutput" class="mono"></pre>
        </div>
    </section>
</main>

<div class="modal-overlay" id="pasteModal">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title">Paste C++ source</div>
            <button class="btn btn-icon" onclick="closePasteModal()" aria-label="Close">
                <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <textarea id="pasteTextarea" placeholder="Paste the contents of secrets.cpp here..."></textarea>
        </div>
        <div class="modal-foot">
            <button class="btn" onclick="closePasteModal()">Cancel</button>
            <button class="btn btn-solid" onclick="processPastedCpp()">Parse &amp; decode</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span></div>

<script>
 // ATK-Cargo defaults — must mirror app/src/main/cpp/secrets.cpp exactly: 8 native methods (n0..n7), same order, same current values.
    const atkCargoDefaults = [
        { name: "getBaseUrl", labelEn: "API base URL", labelFa: "آدرس پایه API", value: "https://atk-nk.ir/Cargo/test_api/" },
        { name: "getExpectedSignatureHash", labelEn: "Expected APK signature (SHA-256)", labelFa: "هش امضای مورد انتظار برنامه", value: "8ca349c0fb572e9d10c62eb5ec6a83c9733eb3b15c362916f6a6efbbd8c2090b" },
        { name: "getLicenseStatusPrefKey", labelEn: "License status pref key", labelFa: "کلید ذخیره‌سازی وضعیت لایسنس", value: "e1f2g3h4i5j6k7l8m9n0o1p2q3r4s5t6" },
        { name: "getSignatureCheckUrl", labelEn: "Signature check endpoint", labelFa: "آدرس بررسی امضا در سرور", value: "https://atk-nk.ir/Cargo/test_api/api/v2/index.php?route=utility/check-signature" },
        { name: "getLicenseCheckUrl", labelEn: "License validate endpoint", labelFa: "آدرس اعتبارسنجی لایسنس", value: "https://atk-nk.ir/Cargo/test_api/api/v2/index.php?route=license/validate" },
        { name: "getLicenseInfoUrl", labelEn: "License info endpoint", labelFa: "آدرس دریافت اطلاعات لایسنس", value: "https://atk-nk.ir/Cargo/test_api/api/v2/index.php?route=license/info" },
        { name: "getLicenseKey", labelEn: "License key", labelFa: "کلید لایسنس نرم‌افزار", value: "13F71ADCB4585F1BE632FFB919F06691" },
        { name: "getApiKey", labelEn: "Update-check API key", labelFa: "کلید API بررسی بروزرسانی", value: "atk_nk_9290VV42-38XQ02DI-F2WY4L2K-EJA7V682" }
    ];

    const defaultLabelsMap = {};
    atkCargoDefaults.forEach(item => { defaultLabelsMap[item.name] = { en: item.labelEn, fa: item.labelFa }; });

    let secretsData = [];

 // ---------- Theme ----------
    function applyTheme(theme) {
        const root = document.documentElement;
        if (theme) root.setAttribute('data-theme', theme); else root.removeAttribute('data-theme');
        const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.getElementById('themeIcon').innerHTML = isDark
            ? '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'
            : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const currentlyDark = current === 'dark' || (!current && systemDark);
        const next = currentlyDark ? 'light' : 'dark';
        try { localStorage.setItem('secretsCodecTheme', next); } catch (_e) { /* storage unavailable (e.g. sandboxed/data: context) */ }
        applyTheme(next);
    }
    let storedTheme = null;
    try { storedTheme = localStorage.getItem('secretsCodecTheme'); } catch (_e) { /* storage unavailable */ }
    applyTheme(storedTheme);

 // ---------- Render ----------
    function renderForm() {
        const container = document.getElementById("secretsForm");
        container.innerHTML = "";
        document.getElementById("secretsCount").innerText = `${secretsData.length} field${secretsData.length === 1 ? '' : 's'}`;

        if (secretsData.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
                    <h3>No fields loaded</h3>
                    <p>Upload secrets.cpp, paste its source, load the ATK Cargo defaults, or add a field manually.</p>
                    <div class="empty-actions">
                        <button class="btn btn-solid" onclick="loadDefaultSecrets()">Load defaults</button>
                        <button class="btn" onclick="openPasteModal()">Paste source</button>
                    </div>
                </div>
            `;
            generateCppCode();
            return;
        }

        const xorKeyHex = document.getElementById("xorKey").value || "0x5A";
        secretsData.forEach((item, index) => {
            const byteLen = encodeXor(item.value, xorKeyHex).length;
            const row = document.createElement("div");
            row.className = "field-row";
            row.innerHTML = `
                <div class="field-top">
                    <span class="field-name">n${index}<span class="field-index">·</span>${escapeHtml(item.name)}()</span>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <span class="chip chip-muted">${byteLen}B</span>
                        <button class="btn-danger-tiny" onclick="removeSecret(${index})" aria-label="Remove field" title="Remove field">
                            <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px;"><path d="M6 6l12 12M18 6L6 18"/></svg>
                        </button>
                    </div>
                </div>
                <div class="field-labels">
                    <span class="field-label-en">${escapeHtml(item.labelEn || item.name)}</span>
                    <span class="field-label-fa fa">${escapeHtml(item.labelFa || 'مقدار استخراج‌شده')}</span>
                </div>
                <input type="text" class="field-input" value="${escapeHtml(item.value)}" oninput="updateSecretValue(${index}, this.value)">
            `;
            container.appendChild(row);
        });

        generateCppCode();
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function updateSecretValue(index, val) {
        secretsData[index].value = val;
        renderForm();
    }

    function addCustomSecret() {
        const name = prompt("Native function name (e.g. getApiKey):");
        if (!name) return;
        const cleanName = name.replace(/[^a-zA-Z0-9_]/g, '');
        if (!cleanName) return;
        const faLabel = prompt("توضیح فارسی (اختیاری):") || "کلید جدید";
        secretsData.push({ name: cleanName, labelEn: `Custom field (${cleanName})`, labelFa: faLabel, value: "" });
        renderForm();
        showToast("Field added.");
    }

    function removeSecret(index) {
        secretsData.splice(index, 1);
        renderForm();
        showToast("Field removed.");
    }

    function clearAllSecrets() {
        secretsData = [];
        renderForm();
        showToast("Form cleared.");
    }

    function loadDefaultSecrets() {
        secretsData = JSON.parse(JSON.stringify(atkCargoDefaults));
        document.getElementById("xorKey").value = "0x5A";
        renderForm();
        showToast(`Loaded ${atkCargoDefaults.length} ATK Cargo default fields.`);
    }

 // ---------- Parser (reverse XOR decoder) ---------- Supports both formats: 1) Current: JNI_OnLoad + RegisterNatives — static jstring n0..nN(...) bound to Java method names via a JNINativeMethod[] table (secrets.cpp).
    function parseAndDecodeCpp(cppContent) {
        if (!cppContent || !cppContent.trim()) {
            alert("Please provide valid C++ content.");
            return;
        }

        let keyHex = "0x5A";
        const keyMatch = cppContent.match(/(?:XOR_KEY|XORKEY|KEY)\s*=\s*(0x[0-9a-fA-F]+|\d+)/i) ||
                         cppContent.match(/#define\s+(?:XOR_KEY|XORKEY|KEY)\s+(0x[0-9a-fA-F]+|\d+)/i) ||
                         cppContent.match(/0x[0-9a-fA-F]{2}/i);
        if (keyMatch && keyMatch[1]) {
            keyHex = keyMatch[1].startsWith("0x") || keyMatch[1].startsWith("0X") ? keyMatch[1] : "0x" + parseInt(keyMatch[1], 10).toString(16).toUpperCase();
        }
        document.getElementById("xorKey").value = keyHex;
        const xorKeyInt = parseInt(keyHex, 16);

        function decodeByteBlock(block) {
            let originalComment = "";
            const commentMatch = block.match(/\/\/\s*Original:\s*"([^"]+)"/);
            if (commentMatch) originalComment = commentMatch[1];

            const arrayMatch = block.match(/\{([\s\S]*?)\}/);
            if (!arrayMatch) return null;

            const hexTokens = arrayMatch[1].match(/0x[0-9a-fA-F]{1,2}|\b\d{1,3}\b/g);
            if (!hexTokens || hexTokens.length === 0) return null;

            const rawBytes = hexTokens.map(h => parseInt(h, h.startsWith("0x") || h.startsWith("0X") ? 16 : 10));
            const decodedBytes = rawBytes.map(b => b ^ xorKeyInt);
            let decodedStr = "";
            try {
                decodedStr = new TextDecoder("utf-8").decode(new Uint8Array(decodedBytes));
            } catch (_e) {
                decodedStr = String.fromCharCode(...decodedBytes);
            }
            decodedStr = decodedStr.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
            return { decodedStr, originalComment };
        }

        let parsed = [];

        const tableEntryRegex = /\{\s*"([A-Za-z0-9_]+)"\s*,\s*"[^"]*"\s*,\s*\(void\*\)\s*([A-Za-z_][A-Za-z0-9_]*)\s*\}/g;
        const nativeMethodTable = [];
        let tEntry;
        while ((tEntry = tableEntryRegex.exec(cppContent)) !== null) {
            nativeMethodTable.push({ javaName: tEntry[1], funcId: tEntry[2] });
        }

        if (nativeMethodTable.length > 0) {
            const funcBodyRegex = /jstring\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(\s*JNIEnv\*[^)]*\)\s*\{([\s\S]*?)\n\}/g;
            const funcBodies = {};
            let fMatch;
            while ((fMatch = funcBodyRegex.exec(cppContent)) !== null) {
                funcBodies[fMatch[1]] = fMatch[2];
            }

            for (const entry of nativeMethodTable) {
                const body = funcBodies[entry.funcId];
                if (!body) continue;
                const decoded = decodeByteBlock(body);
                if (!decoded) continue;

                const mappedInfo = defaultLabelsMap[entry.javaName] || {};
                parsed.push({
                    name: entry.javaName,
                    labelEn: mappedInfo.en || `Field (${entry.javaName})`,
                    labelFa: mappedInfo.fa || (decoded.originalComment ? `اصلی: ${decoded.originalComment}` : `کلید استخراج‌شده`),
                    value: decoded.decodedStr
                });
            }
        }

        if (parsed.length === 0) {
            const funcBlocks = cppContent.split(/(?=JNIEXPORT|Java_)/g);
            for (let block of funcBlocks) {
                const nameMatch = block.match(/Java_[a-zA-Z0-9_]+?Secrets_([a-zA-Z0-9_]+)\s*\(/i) ||
                                  block.match(/Java_[a-zA-Z0-9_]+_([a-zA-Z0-9_]+)\s*\(/i);
                if (!nameMatch) continue;

                const funcName = nameMatch[1];
                const decoded = decodeByteBlock(block);
                if (!decoded) continue;

                const mappedInfo = defaultLabelsMap[funcName] || {};
                parsed.push({
                    name: funcName,
                    labelEn: mappedInfo.en || `Field (${funcName})`,
                    labelFa: mappedInfo.fa || (decoded.originalComment ? `اصلی: ${decoded.originalComment}` : `کلید استخراج‌شده`),
                    value: decoded.decodedStr
                });
            }
        }

        if (parsed.length > 0) {
            secretsData = parsed;
            renderForm();
            showToast(`Parsed and decoded ${parsed.length} field${parsed.length === 1 ? '' : 's'}.`);
        } else {
            alert("Could not parse valid JNI secrets functions from this source.\nSupported: JNI_OnLoad/RegisterNatives table (current secrets.cpp format) or legacy Java_..._Secrets_... exports.");
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => parseAndDecodeCpp(e.target.result);
        reader.readAsText(file);
        event.target.value = "";
    }

    function openPasteModal() {
        document.getElementById("pasteModal").classList.add("active");
        document.getElementById("pasteTextarea").focus();
    }
    function closePasteModal() {
        document.getElementById("pasteModal").classList.remove("active");
    }
    function processPastedCpp() {
        const text = document.getElementById("pasteTextarea").value;
        if (!text.trim()) { alert("Please paste C++ code first."); return; }
        parseAndDecodeCpp(text);
        closePasteModal();
        document.getElementById("pasteTextarea").value = "";
    }

 // ---------- Encoder ----------
    function encodeXor(str, keyHex) {
        let key = parseInt(keyHex, 16);
        if (isNaN(key)) key = 0x5A;
        const bytes = new TextEncoder().encode(str);
        return Array.from(bytes).map(b => b ^ key);
    }

    function formatBytesToCpp(bytes) {
        const hexList = bytes.map(b => '0x' + b.toString(16).padStart(2, '0').toUpperCase());
        let lines = [];
        for (let i = 0; i < hexList.length; i += 16) lines.push(hexList.slice(i, i + 16).join(', '));
        return lines.join(',\n            ');
    }

 // Matches the current JNI_OnLoad/RegisterNatives format used in app/src/main/cpp/secrets.cpp (no Java_pkg_Class_method symbols).
    function generateCppCode() {
        const xorKeyHex = document.getElementById("xorKey").value || "0x5A";

        if (secretsData.length === 0) {
            document.getElementById("cppOutput").textContent = "// No fields loaded. Add or paste fields to generate C++ code.";
            return;
        }

        let cpp = `#include <jni.h>\n#include <string>\n#include <vector>\n\n`;
        cpp += `// XOR encryption key\nconst uint8_t XOR_KEY = ${xorKeyHex};\n\n`;
        cpp += `std::string decryptXor(const uint8_t* encryptedBytes, size_t length) {\n`;
        cpp += `    std::string decrypted;\n`;
        cpp += `    for (size_t i = 0; i < length; ++i) {\n`;
        cpp += `        decrypted += (char)(encryptedBytes[i] ^ XOR_KEY);\n`;
        cpp += `    }\n`;
        cpp += `    return decrypted;\n`;
        cpp += `}\n\n`;

        secretsData.forEach((item, index) => {
            const encryptedBytes = encodeXor(item.value, xorKeyHex);
            const formattedBytes = formatBytesToCpp(encryptedBytes);
            const len = encryptedBytes.length;

            cpp += `static jstring n${index}(JNIEnv* env, jobject) {\n`;
            cpp += `    const uint8_t bytes[] = {\n            ${formattedBytes}\n    };\n`;
            cpp += `    return env->NewStringUTF(decryptXor(bytes, ${len}).c_str());\n`;
            cpp += `}\n\n`;
        });

        cpp += `static const JNINativeMethod kSecretsMethods[] = {\n`;
        secretsData.forEach((item, index) => {
            cpp += `        {"${item.name}", "()Ljava/lang/String;", (void*) n${index}},\n`;
        });
        cpp += `};\n\n`;

        cpp += `extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* vm, void* /* reserved */) {\n`;
        cpp += `    JNIEnv* env;\n`;
        cpp += `    if (vm->GetEnv(reinterpret_cast<void**>(&env), JNI_VERSION_1_6) != JNI_OK) {\n`;
        cpp += `        return JNI_ERR;\n`;
        cpp += `    }\n\n`;
        cpp += `    jclass clazz = env->FindClass("com/atk/atk_cargo/api/Secrets");\n`;
        cpp += `    if (clazz == nullptr) {\n`;
        cpp += `        return JNI_ERR;\n`;
        cpp += `    }\n\n`;
        cpp += `    jint result = env->RegisterNatives(\n`;
        cpp += `            clazz, kSecretsMethods,\n`;
        cpp += `            sizeof(kSecretsMethods) / sizeof(kSecretsMethods[0]));\n`;
        cpp += `    env->DeleteLocalRef(clazz);\n\n`;
        cpp += `    if (result != JNI_OK) {\n`;
        cpp += `        return JNI_ERR;\n`;
        cpp += `    }\n\n`;
        cpp += `    return JNI_VERSION_1_6;\n`;
        cpp += `}\n`;

        document.getElementById("cppOutput").textContent = cpp;
    }

    function wipeMemory() {
        secretsData = [];
        document.getElementById("xorKey").value = "0x5A";
        renderForm();
        showToast("Local memory cleared.");
    }

    function copyCode() {
        const code = document.getElementById("cppOutput").textContent;
        navigator.clipboard.writeText(code).then(() => showToast("Copied to clipboard."));
    }

    function downloadCppFile() {
        const code = document.getElementById("cppOutput").textContent;
        const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "secrets.cpp";
        link.click();
        showToast("secrets.cpp downloaded.");
    }

    let toastTimer = null;
    function showToast(msg) {
        const toast = document.getElementById("toast");
        document.getElementById("toastText").textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    renderForm();
</script>
