# Specifies the JVM arguments used for the daemon process.
# ==================== بهینه‌سازی‌های Gradle ====================
# تنظیمات حافظه JVM برای عملکرد بهتر
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication

# فعال‌سازی Parallel execution
org.gradle.parallel=true

# فعال‌سازی Gradle Daemon
org.gradle.daemon=true

# فعال‌سازی Configuration Cache (بهبود سرعت)
org.gradle.configuration-cache=true

# فعال‌سازی Build Cache
org.gradle.caching=true

# فعال‌سازی File System Watching
org.gradle.vfs.watch=true

# تنظیم Console Output
org.gradle.console=rich

# تنظیم Warning Mode
org.gradle.warning.mode=all

# ==================== بهینه‌سازی‌های Android ====================
# فعال‌سازی AndroidX
android.useAndroidX=true

# فعال‌سازی Jetifier برای کتابخانه‌های قدیمی
android.enableJetifier=true

# فعال‌سازی R8 full mode برای بهینه‌سازی بیشتر
android.enableR8.fullMode=true

# بهینه‌سازی Resource Shrinking
android.enableResourceOptimizations=true

# فعال‌سازی Non-transitive R classes
android.nonTransitiveRClass=true

# فعال‌سازی Non-final Resource IDs
android.nonFinalResIds=true

# ==================== بهینه‌سازی‌های Kotlin ====================
# تنظیم کد استایل Kotlin
kotlin.code.style=official

# فعال‌سازی Incremental Compilation
kotlin.incremental=true
kotlin.incremental.android=true

# فعال‌سازی Parallel Tasks
kotlin.parallel.tasks.in.project=true

# استفاده از Worker API
kotlin.compiler.execution.strategy=in-process

# ==================== بهینه‌سازی‌های Compose ====================
# فعال‌سازی Compose Compiler Metrics
android.experimental.enableComposeCompilerMetrics=true
android.experimental.enableComposeCompilerReports=true

# ==================== تنظیمات Build Features ====================
# فعال‌سازی BuildConfig
android.defaults.buildfeatures.buildconfig=true

# فعال‌سازی ViewBinding
android.defaults.buildfeatures.viewbinding=true

# فعال‌سازی Compose
android.defaults.buildfeatures.compose=true

# ==================== تنظیمات امنیتی و شبکه ====================
# تنظیم timeout برای اتصالات HTTP
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
