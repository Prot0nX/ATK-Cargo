<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK Cargo - هدایت به پنل مدیریت</title>
    <meta http-equiv="refresh" content="0; url=online_users_manager.html">
    
 <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    
 <!-- آیکون‌های Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <style>
 * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }
        
 /* انیمیشن پس‌زمینه */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="%23ffffff" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            animation: float 20s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 60px 50px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.8s ease-out;
        }
        
        .redirect-btn {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.3);
        }
        
        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(116, 185, 255, 0.4);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .icon-container {
            margin-bottom: 30px;
            position: relative;
        }
        
        .main-icon {
            font-size: 4.5em;
            color: #74b9ff;
            text-shadow: 0 0 30px rgba(116, 185, 255, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .brand {
            font-size: 1.8em;
            font-weight: 700;
            color: #74b9ff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        h1 {
            font-size: 2.8em;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e6ed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            line-height: 1.2;
        }
        
        .warning-box {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.15) 0%, rgba(255, 71, 87, 0.15) 100%);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-top: 35px;
            position: relative;
            overflow: hidden;
        }
        
        .warning-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .warning-icon {
            font-size: 1.5em;
            color: #ff6b6b;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        .warning-text {
            font-size: 1em;
            font-weight: 600;
            color: #ffffff;
            display: inline-block;
            vertical-align: middle;
        }
        
        .contact-info {
            font-size: 0.95em;
            color: #a8b8d8;
            margin-top: 15px;
            font-weight: 400;
        }
        
 /* ریسپانسیو */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2.2em;
            }
            
            .main-icon {
                font-size: 3.5em;
            }
            
            .brand {
                font-size: 1.5em;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .description {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">ATK CARGO</div>
        
        <div class="icon-container">
            <i class="fas fa-users main-icon"></i>
        </div>
        
        <h1>هدایت به پنل مدیریت</h1>
        
        <div class="warning-box">
            <i class="fas fa-users warning-icon"></i>
            <span class="warning-text">مدیریت کاربران آنلاین</span>
            <div class="contact-info">
                در حال هدایت به پنل مدیریت کاربران آنلاین...<br>
                اگر به صورت خودکار هدایت نشدید، روی دکمه زیر کلیک کنید.
            </div>
            <a href="online_users_manager.html" class="redirect-btn">
                <i class="fas fa-arrow-left" style="margin-left: 8px;"></i>
                ورود به پنل مدیریت
            </a>
        </div>
    </div>
</body>
</html>
