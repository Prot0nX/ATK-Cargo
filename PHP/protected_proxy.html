<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP Files Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --bg: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --primary-light: #a5b4fc;
            --secondary: #94a3b8;
            --success: #34d399;
            --warning: #fbbf24;
            --error: #f87171;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --border: #475569;
            --border-light: #334155;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            opacity: 0.03;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        [data-theme="dark"] body::before {
            opacity: 0.1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem 0;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
            box-shadow: var(--shadow-md);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .theme-toggle {
            position: relative;
            width: 3rem;
            height: 1.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 1.25rem;
            height: 1.25rem;
            background: var(--primary);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }

        [data-theme="dark"] .theme-toggle::before {
            transform: translateX(1.5rem);
        }

        .theme-toggle:hover {
            background: var(--border);
            transform: scale(1.05);
        }

        .main-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-card {
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .file-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-xl);
            transform: translateY(-4px);
        }

        .file-card:hover::before {
            transform: scaleX(1);
        }

        .file-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .file-icon {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .file-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
            word-break: break-all;
            line-height: 1.3;
        }

        .file-meta {
            display: flex;
            gap: 0.8rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .file-actions {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .protected-url {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: var(--radius-sm);
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 0.65rem;
            word-break: break-all;
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
        }

        .protected-url::before {
            content: '🔒';
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            opacity: 0.5;
        }

        .status-message {
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-loading {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            animation: fadeIn 0.5s ease-out;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-spinner {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .main-card {
                padding: 1.5rem;
                border-radius: var(--radius);
            }
            
            .file-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .file-actions {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">📁</div>
                <h1>PHP Files Manager</h1>
            </div>
            <div class="theme-toggle" onclick="toggleTheme()" title="Toggle theme"></div>
        </div>
        
        <div class="main-card">
            <div class="controls">
                <button class="btn btn-primary" onclick="generateProxy()">
                    <span>🔒</span> Generate Protected Proxy
                </button>
                <button class="btn btn-success" onclick="loadPHPFiles()">
                    <span>🔄</span> Refresh Files
                </button>
            </div>
            
            <div id="loading" class="status-message status-loading" style="display: none;">
                <div class="loading-spinner"></div>
                Loading PHP files...
            </div>
            
            <div id="error" class="status-message status-error" style="display: none;"></div>
            
            <div id="fileList" class="file-grid"></div>
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        async function generateProxy() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            showStatus('loading', '✨ Generating obfuscated proxy file...');
            hideStatus('error');
            
            try {
                const response = await fetch('proxy_generator.php', {
                    method: 'GET'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('success', `✅ Success! ${data.message}`, 
                        `Generated at: ${new Date(data.timestamp * 1000).toLocaleString()}`);
                    
                    // Auto-remove success message after 5 seconds
                    setTimeout(() => hideStatus('success'), 5000);
                    
                    // Refresh the file list with animation delay
                    setTimeout(() => loadPHPFiles(), 500);
                } else {
                    throw new Error(data.error || 'Failed to generate proxy');
                }
                
            } catch (err) {
                console.error('Error generating proxy:', err);
                showStatus('error', '❌ Error generating proxy: ' + err.message);
            } finally {
                hideStatus('loading');
            }
        }
        
        async function loadPHPFiles() {
            const fileList = document.getElementById('fileList');
            
            showStatus('loading', '🔍 Loading PHP files...');
            hideStatus('error');
            
            // Add fade out animation to existing files
            fileList.style.opacity = '0';
            fileList.style.transform = 'translateY(10px)';
            
            try {
                const response = await fetch('file_manager.php');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Wait for fade out animation before updating content
                setTimeout(() => {
                    displayFiles(data.files);
                    // Fade in new content
                    fileList.style.opacity = '1';
                    fileList.style.transform = 'translateY(0)';
                }, 200);
                
            } catch (err) {
                console.error('Error loading files:', err);
                showStatus('error', '❌ Error loading PHP files: ' + err.message);
                fileList.style.opacity = '1';
                fileList.style.transform = 'translateY(0)';
            } finally {
                hideStatus('loading');
            }
        }
        
        function displayFiles(files) {
            const fileList = document.getElementById('fileList');
            
            if (files.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📁</div>
                        <div>No PHP files found in the current directory.</div>
                        <div style="margin-top: 0.5rem; font-size: 0.875rem; opacity: 0.7;">Upload some PHP files to get started!</div>
                    </div>
                `;
                return;
            }
            
            fileList.innerHTML = '';
            
            files.forEach((file, index) => {
                const fileCard = document.createElement('div');
                fileCard.className = 'file-card';
                fileCard.style.animationDelay = `${index * 0.1}s`;
                
                const protectedUrl = `protected_proxy.php?target=${encodeURIComponent(file.name)}`;
                const fullProtectedUrl = `${window.location.origin}${window.location.pathname.replace('protected_proxy.html', '')}${protectedUrl}`;
                
                fileCard.innerHTML = `
                    <div class="file-header">
                        <div class="file-icon">📄</div>
                        <div class="file-name">${escapeHtml(file.name)}</div>
                    </div>
                    <div class="file-meta">
                        <div class="meta-item">
                            <span>📊</span>
                            <span>${formatFileSize(file.size)}</span>
                        </div>
                        <div class="meta-item">
                            <span>📅</span>
                            <span>${new Date(file.modified * 1000).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <div class="file-actions">
                        <a href="${escapeHtml(file.name)}" class="btn btn-primary" target="_blank">
                            <span>🔗</span> Direct Access
                        </a>
                        <a href="${escapeHtml(protectedUrl)}" class="btn btn-secondary" target="_blank">
                            <span>🔒</span> Protected Access
                        </a>
                    </div>
                    <div class="protected-url">
                        <strong>🛡️ Protected URL:</strong><br>
                        <span style="font-size: 0.7rem; word-break: break-all;">${escapeHtml(fullProtectedUrl)}</span>
                    </div>
                `;
                
                fileList.appendChild(fileCard);
            });
        }
        
        function showStatus(type, message, subtitle = '') {
            const statusElement = document.getElementById(type === 'success' ? 'success' : type);
            if (!statusElement) {
                if (type === 'success') {
                    const successDiv = document.createElement('div');
                    successDiv.id = 'success';
                    successDiv.className = 'status-message status-success';
                    document.querySelector('.main-card').insertBefore(successDiv, document.getElementById('fileList'));
                }
            }
            
            const element = document.getElementById(type === 'success' ? 'success' : type);
            if (element) {
                element.innerHTML = `
                    <div>${message}</div>
                    ${subtitle ? `<div style="font-size: 0.8em; opacity: 0.8; margin-top: 0.25rem;">${subtitle}</div>` : ''}
                `;
                element.style.display = 'flex';
                element.style.animation = 'slideDown 0.3s ease-out';
            }
        }
        
        function hideStatus(type) {
            const element = document.getElementById(type);
            if (element) {
                element.style.display = 'none';
                if (type === 'success' && element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Initialize theme and load files when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            initTheme();
            
            // Add smooth transitions to file list
            const fileList = document.getElementById('fileList');
            fileList.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            
            // Auto-generate proxy on page load with loading animation
            await generateProxy();
        });
        
        // Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
        
        // Add intersection observer for fade-in animations
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '50px'
            });
            
            // Observe file cards when they're added
            const observeFileCards = () => {
                document.querySelectorAll('.file-card').forEach(card => {
                    observer.observe(card);
                });
            };
            
            // Re-observe when file list changes
            const fileListObserver = new MutationObserver(observeFileCards);
            fileListObserver.observe(document.getElementById('fileList'), {
                childList: true
            });
        }
    </script>
</body>
</html>
