<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Proxy Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-body: #f3f4f6;
            --bg-card: rgba(255, 255, 255, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.4);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: rgba(255, 255, 255, 0.5);
            --border-strong: rgba(229, 231, 235, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --shadow-hover: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
            --success: #10b981;
            --error: #ef4444;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --bg-body: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-glass: rgba(30, 41, 59, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.05);
            --border-strong: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Search Bar */
        .search-wrapper {
            position: relative;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .btn-glass {
            background: var(--bg-glass);
            color: var(--text-main);
            border: 1px solid var(--border-strong);
            backdrop-filter: blur(10px);
        }

        .btn-glass:hover {
            background: var(--bg-card);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .icon-btn {
            padding: 0.75rem;
            border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-strong);
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
            transform: rotate(15deg);
        }

        /* Grid */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .file-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .file-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .file-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .file-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1rem;
            word-break: break-all;
        }

        .file-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
            margin-top: 0.25rem;
        }

        .url-box {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 0.75rem;
            position: relative;
        }
        
        [data-theme="dark"] .url-box {
            background: rgba(255, 255, 255, 0.03);
        }

        .url-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
            display: block;
        }

        .url-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--primary);
            word-break: break-all;
            display: block;
            margin-bottom: 0.5rem;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .action-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text-main);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            text-decoration: none;
        }

        .action-btn:hover {
            background: var(--bg-glass);
            border-color: var(--primary);
            color: var(--primary);
        }

        .action-btn.primary {
            background: rgba(99, 102, 241, 0.1);
            border-color: transparent;
            color: var(--primary);
        }

        .action-btn.primary:hover {
            background: var(--primary);
            color: white;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-strong);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 300px;
            border-left: 4px solid var(--primary);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--error); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Loading & Empty States */
        .state-container {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-strong);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; gap: 1rem; }
            .search-wrapper { width: 100%; }
            .header-actions { justify-content: space-between; }
            .files-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo-box">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <div>
                    <h1>Proxy Manager</h1>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Secure File Access Control</div>
                </div>
            </div>

            <div class="header-actions">
                <div class="search-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="search-input" placeholder="Search files..." id="searchInput" oninput="filterFiles()">
                </div>
                
                <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </header>

        <div class="controls" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <button class="btn btn-primary" onclick="generateProxy()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Generate Proxy
            </button>
            <button class="btn btn-glass" onclick="loadPHPFiles()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Refresh List
            </button>
        </div>

        <main id="fileGrid" class="files-grid">
            <!-- Files will be injected here -->
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // State
        let allFiles = [];

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';

            toast.innerHTML = `
                <span style="font-size: 1.2rem;">${icon}</span>
                <div>
                    <div style="font-weight: 500;">${type.charAt(0).toUpperCase() + type.slice(1)}</div>
                    <div style="font-size: 0.9rem; opacity: 0.9;">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            // Auto remove
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Core Functions
        async function loadPHPFiles() {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = `
                <div class="state-container">
                    <div class="spinner"></div>
                    <p>Scanning directory for PHP files...</p>
                </div>
            `;

            try {
                const response = await fetch('file_manager.php');
                if (!response.ok) throw new Error('Failed to fetch files');
                
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                
                allFiles = data.files || [];
                renderFiles(allFiles);
                
                if (allFiles.length > 0) {
                    showToast(`Loaded ${allFiles.length} files successfully`, 'success');
                }

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="state-container">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                        <p style="color: var(--error);">Error: ${err.message}</p>
                        <button class="btn btn-glass" style="margin-top: 1rem;" onclick="loadPHPFiles()">Try Again</button>
                    </div>
                `;
                showToast(err.message, 'error');
            }
        }

        function renderFiles(files) {
            const grid = document.getElementById('fileGrid');
            
            if (files.length === 0) {
                grid.innerHTML = `
                    <div class="state-container">
                        <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;">📂</div>
                        <p>No PHP files found in this directory.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = files.map((file, index) => {
                const protectedUrl = `protected_proxy.php?target=${encodeURIComponent(file.name)}`;
                const fullUrl = `${window.location.origin}${window.location.pathname.replace('protected_proxy.html', '')}${protectedUrl}`;
                
                return `
                    <div class="file-card" style="animation: slideIn 0.5s ease-out ${index * 0.05}s backwards;">
                        <div class="card-header">
                            <div class="file-info">
                                <div class="file-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                                </div>
                                <div>
                                    <div class="file-name">${file.name}</div>
                                    <div class="file-meta">
                                        <span>${formatSize(file.size)}</span>
                                        <span>•</span>
                                        <span>${new Date(file.modified * 1000).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="url-box">
                            <span class="url-label">Protected Endpoint</span>
                            <span class="url-text">${protectedUrl}</span>
                        </div>

                        <div class="card-actions">
                            <a href="${file.name}" target="_blank" class="action-btn" title="Direct Access">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                                Direct
                            </a>
                            <a href="${protectedUrl}" target="_blank" class="action-btn primary" title="Protected Access">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                Open
                            </a>
                            <button onclick="copyToClipboard('${fullUrl}')" class="action-btn" title="Copy Link">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function generateProxy() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0;"></div> Generating...';
            btn.disabled = true;

            try {
                const response = await fetch('proxy_generator.php');
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    setTimeout(() => loadPHPFiles(), 1000);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function filterFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFiles.filter(file => 
                file.name.toLowerCase().includes(query)
            );
            renderFiles(filtered);
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('Protected URL copied to clipboard!', 'success');
            } catch (err) {
                showToast('Failed to copy URL', 'error');
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadPHPFiles();
        });
    </script>
</body>
</html>
