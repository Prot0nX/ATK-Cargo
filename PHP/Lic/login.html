<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت - ATK Cargo</title>
    <link rel="icon" type="image/x-icon" href="assets/img/fav.ico">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/fav.ico">
    <link rel="apple-touch-icon" href="assets/img/fav.ico">
    
    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    
    <!-- آیکون‌های Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS سفارشی -->
    <link rel="stylesheet" href="license-manager.css">
    
    <!-- MD5 Library -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.8.3/src/md5.min.js"></script>
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'vazir': ['Vazirmatn', 'Vazir', 'Tahoma', 'Arial', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            200: '#BFDBFE',
                            300: '#93C5FD',
                            400: '#60A5FA',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                            800: '#1E40AF',
                            900: '#1E3A8A',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'fade-in-up': 'fadeInUp 0.5s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Background Gradient - Minimal with Theme Transition */
        body.bg-minimal {
            background: linear-gradient(135deg, #F9FAFB 0%, #E5E7EB 100%) !important;
            transition: background 0.3s ease;
        }
        
        body.dark.bg-minimal {
            background: linear-gradient(135deg, #111827 0%, #1F2937 100%) !important;
            transition: background 0.3s ease;
        }
        
        /* Login Card with Theme Transition */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .dark .login-card {
            background: rgba(17, 24, 39, 0.95);
            border-color: rgba(55, 65, 81, 0.8);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        
        /* Input Styles with Theme Transition */
        .input-field {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-field:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        /* Button Styles */
        .btn-primary {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        /* Theme Transition Utility */
        .theme-transition {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* SweetAlert2 Dark Mode Support */
        .swal2-popup {
            background: rgba(255, 255, 255, 0.98) !important;
            color: #1F2937 !important;
            border-radius: 1rem !important;
            transition: background 0.3s ease, color 0.3s ease !important;
        }
        
        .dark .swal2-popup {
            background: rgba(31, 41, 55, 0.98) !important;
            color: #F9FAFB !important;
        }
        
        .swal2-title {
            color: inherit !important;
        }
        
        .swal2-html-container {
            color: inherit !important;
        }
        
        .swal2-confirm {
            background: linear-gradient(to right, #3B82F6, #2563EB) !important;
            border-radius: 0.75rem !important;
            transition: all 0.3s ease !important;
        }
        
        .swal2-confirm:hover {
            transform: translateY(-1px) !important;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3) !important;
        }
        
        .swal2-cancel {
            background: #6B7280 !important;
            border-radius: 0.75rem !important;
            transition: all 0.3s ease !important;
        }
        
        .swal2-cancel:hover {
            background: #4B5563 !important;
            transform: translateY(-1px) !important;
        }
        
        .swal2-icon {
            border-color: transparent !important;
        }
        
        .swal2-icon.swal2-error {
            border-color: #EF4444 !important;
            color: #EF4444 !important;
        }
        
        .swal2-icon.swal2-success {
            border-color: #10B981 !important;
            color: #10B981 !important;
        }
        
        .swal2-icon.swal2-warning {
            border-color: #F59E0B !important;
            color: #F59E0B !important;
        }
        
        .swal2-icon.swal2-info {
            border-color: #3B82F6 !important;
            color: #3B82F6 !important;
        }
        
        .swal2-backdrop-show {
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(4px) !important;
        }
        
        .dark .swal2-backdrop-show {
            background: rgba(0, 0, 0, 0.6) !important;
        }
        
        .swal2-timer-progress-bar {
            background: rgba(59, 130, 246, 0.4) !important;
        }
        
        .dark .swal2-timer-progress-bar {
            background: rgba(59, 130, 246, 0.6) !important;
        }
    </style>
</head>
<body class="font-vazir min-h-screen bg-minimal flex items-center justify-center p-4 theme-transition">
    
    <!-- Main Container -->
    <div class="w-full max-w-md animate-fade-in-up">
        
        <!-- Login Card -->
        <div class="login-card rounded-2xl p-8 md:p-10 animate-scale-in">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <!-- Logo -->
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl shadow-lg mb-4">
                    <i class="fas fa-key text-white text-2xl"></i>
                </div>
                
                <!-- Title -->
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-2">
                    ATK CARGO
                </h1>
                
                <!-- Subtitle -->
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    ورود به پنل مدیریت لایسنس‌ها
                </p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                
                <!-- Password Field -->
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        رمز عبور
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            required
                            autocomplete="current-password"
                            aria-label="رمز عبور"
                            class="input-field w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="رمز عبور خود را وارد کنید">
                        
                        <!-- Toggle Password Visibility -->
                        <button 
                            type="button" 
                            id="togglePassword"
                            aria-label="نمایش/مخفی کردن رمز عبور"
                            class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded-lg p-1">
                            <i class="fas fa-eye text-lg"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    aria-label="ورود به پنل"
                    class="btn-primary w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="submitText">ورود به پنل</span>
                </button>
                
            </form>
            
            <!-- Security Info -->
            <div class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                <div class="flex items-center justify-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                    <i class="fas fa-shield-alt text-green-500"></i>
                    <span>اتصال امن و رمزگذاری شده</span>
                </div>
            </div>
            
        </div>
        
        <!-- Footer -->
        <div class="mt-6 text-center animate-fade-in">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                © 2025 ATK Cargo. تمامی حقوق محفوظ است.
            </p>
        </div>
        
    </div>
    
    <!-- Theme Toggle Button -->
    <button 
        id="themeToggle" 
        aria-label="تغییر تم"
        class="fixed top-6 left-6 p-3 rounded-xl bg-white/80 dark:bg-gray-800/80 backdrop-blur-sm border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white theme-transition hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-lg">
        <i id="sunIcon" class="fas fa-sun text-lg"></i>
        <i id="moonIcon" class="fas fa-moon text-lg hidden"></i>
    </button>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 text-center shadow-xl">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-gray-900 dark:text-white font-medium">در حال ورود<span class="loading-dots"></span></p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">لطفاً صبر کنید...</p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="login.js"></script>
    
    <script>
        // ============================================
        // Theme Management
        // ============================================
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const body = document.body;
        
        /**
         * Initialize theme based on saved preference or system preference
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
            
            if (isDark) {
                body.classList.add('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                body.classList.remove('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        }
        
        /**
         * Toggle theme between light and dark
         */
        function toggleTheme() {
            body.classList.toggle('dark');
            const isDark = body.classList.contains('dark');
            
            if (isDark) {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                localStorage.setItem('theme', 'dark');
            } else {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Initialize theme on page load
        initTheme();
        
        // Add event listener for theme toggle button
        themeToggle.addEventListener('click', toggleTheme);
        
        // ============================================
        // Password Toggle Visibility
        // ============================================
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = togglePassword.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
        
        // ============================================
        // Loading States Management
        // ============================================
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }
        
        // ============================================
        // Auto-focus password field on page load
        // ============================================
        setTimeout(() => {
            passwordInput.focus();
        }, 300);
    </script>
</body>
</html>
