<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATK Cargo - دسترسی محدود</title>
    <link rel="icon" type="image/x-icon" href="assets/img/fav.ico">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/fav.ico">
    <link rel="apple-touch-icon" href="assets/img/fav.ico">
    
    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
    
    <!-- آیکون‌های Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'vazirmatn': ['Vazirmatn', 'Vazir', 'Tahoma', 'Arial', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'slide-up': 'slideUp 1s ease-out',
                        'shimmer': 'shimmer 2s infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'bounce-slow': 'bounce 3s infinite',
                        'rotate-slow': 'rotate 20s linear infinite'
                    }
                }
            }
        }
    </script>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(116, 185, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(116, 185, 255, 0.8), 0 0 40px rgba(116, 185, 255, 0.3); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #e0e6ed 50%, #74b9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .icon-glow {
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.6));
        }
        
        .floating-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: floatParticle 20s infinite linear;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .warning-shimmer::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 3s infinite;
        }
        
        .brand-glow {
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-5px) scale(1.02);
        }
        
        .pulse-ring {
            position: absolute;
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 50%;
            animation: pulseRing 2s infinite;
        }
        
        @keyframes pulseRing {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="font-vazirmatn gradient-bg min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Floating Particles Background -->
    <div class="floating-particles">
        <div class="particle w-2 h-2" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle w-1 h-1" style="left: 20%; animation-delay: 2s;"></div>
        <div class="particle w-3 h-3" style="left: 30%; animation-delay: 4s;"></div>
        <div class="particle w-1 h-1" style="left: 40%; animation-delay: 6s;"></div>
        <div class="particle w-2 h-2" style="left: 50%; animation-delay: 8s;"></div>
        <div class="particle w-1 h-1" style="left: 60%; animation-delay: 10s;"></div>
        <div class="particle w-2 h-2" style="left: 70%; animation-delay: 12s;"></div>
        <div class="particle w-1 h-1" style="left: 80%; animation-delay: 14s;"></div>
        <div class="particle w-3 h-3" style="left: 90%; animation-delay: 16s;"></div>
    </div>
    
    <!-- Rotating Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-gradient-to-r from-blue-400/10 to-purple-400/10 rounded-full animate-rotate-slow"></div>
        <div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-gradient-to-r from-pink-400/10 to-red-400/10 rounded-full animate-rotate-slow" style="animation-direction: reverse; animation-duration: 25s;"></div>
    </div>
    
    <!-- Main Container -->
    <div class="relative z-10 text-center glass-morphism rounded-3xl p-12 max-w-lg w-11/12 animate-slide-up hover-lift">
        <!-- Brand Logo -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-blue-300 brand-glow mb-2 tracking-wider">ATK CARGO</h2>
            <div class="w-16 h-1 bg-gradient-to-r from-blue-400 to-purple-400 mx-auto rounded-full"></div>
        </div>
        
        <!-- Icon Container with Pulse Ring -->
        <div class="relative mb-8 inline-block">
            <div class="pulse-ring w-24 h-24 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></div>
            <div class="pulse-ring w-24 h-24 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2" style="animation-delay: 1s;"></div>
            <div class="relative z-10 w-24 h-24 bg-gradient-to-br from-red-400 to-pink-500 rounded-full flex items-center justify-center animate-float">
                <i class="fas fa-shield-alt text-4xl text-white icon-glow"></i>
            </div>
        </div>
        
        <!-- Main Title -->
        <h1 class="text-4xl md:text-5xl font-black mb-8 text-gradient leading-tight animate-pulse-slow">
            دسترسی محدود
        </h1>
        
        <!-- Warning Box -->
        <div class="relative bg-gradient-to-r from-red-500/20 to-pink-500/20 border border-red-400/30 rounded-2xl p-6 mt-8 overflow-hidden warning-shimmer">
            <!-- Warning Header -->
            <div class="flex items-center justify-center mb-4">
                <div class="w-8 h-8 bg-gradient-to-r from-red-400 to-pink-400 rounded-full flex items-center justify-center animate-bounce-slow mr-3">
                    <i class="fas fa-exclamation-triangle text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold text-red-200">هشدار امنیتی</span>
            </div>
            
            <!-- Warning Content -->
            <div class="space-y-3 text-gray-200">
                <p class="text-lg font-medium">
                    شما مجاز به مشاهده محتویات این بخش نیستید
                </p>
                <p class="text-base opacity-90">
                    این منطقه تنها برای کاربران مجاز قابل دسترسی است
                </p>
            </div>
            
            <!-- Security Badge -->
            <div class="mt-6 inline-flex items-center px-4 py-2 bg-gradient-to-r from-gray-800/50 to-gray-900/50 rounded-full border border-gray-600/30">
                <i class="fas fa-lock text-yellow-400 mr-2"></i>
                <span class="text-sm text-gray-300 font-medium">محافظت شده توسط ATK Security</span>
            </div>
        </div>
        
        <!-- Footer Info -->
        <div class="mt-8 pt-6 border-t border-white/10">
            <p class="text-sm text-gray-300 opacity-75">
                <i class="fas fa-info-circle mr-2"></i>
                برای دسترسی به این بخش، لطفاً با مدیر سیستم تماس بگیرید
            </p>
        </div>
    </div>
    
    <!-- Background Overlay -->
    <div class="absolute inset-0 bg-black/20 pointer-events-none"></div>
    
    <script>
        // Add dynamic particle generation
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = particle.style.height = Math.random() * 4 + 1 + 'px';
            particle.style.animationDuration = Math.random() * 10 + 15 + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            
            document.querySelector('.floating-particles').appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 25000);
        }
        
        // Generate particles periodically
        setInterval(createParticle, 3000);
        
        // Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
        
        // Add entrance animation delay for better UX
        setTimeout(() => {
            document.body.classList.add('loaded');
        }, 100);
    </script>
</body>
</html>
