name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP lint + PHPStan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PHP
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

 # اعتبارسنجی سینتکس تمام فایل‌های PHP پروژه با دستور php -l.
      - name: PHP syntax check (php -l)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

 # تحلیل استاتیک کدهای PHP با ابزار PHPStan.
      - name: PHPStan (level 7)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

 # اجرای تست‌های واحد PHPUnit برای منطق‌های مستقل از دیتابیس.
      - name: PHPUnit
        run: vendor/bin/phpunit

  android:
    name: Android lint + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

 # تنظیم دسترسی اجرایی برای اسکریپت gradlew در محیط لینوکس CI.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile (debug)
        run: ./gradlew :app:compileDebugKotlin --console=plain

 # اجرای تست‌های واحد سراسر ماژول‌ها شامل app و ماژول‌های core و feature.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

 # بررسی قوانین Lint برای نسخه‌های debug و release.
      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --console=plain

      - name: Lint (release)
        run: ./gradlew :app:lintRelease --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 14

 # بیلد نسخه نهایی و اعمال قوانین R8/ProGuard.
      - name: Assemble release (R8 gate)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload release mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 14
