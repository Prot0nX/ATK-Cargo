<html dir="rtl" lang="fa">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ATK Cargo - ورود به حساب</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Vazirmatn:wght@100..900&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Vazirmatn", "Inter", "sans-serif"],
                        "sans": ["Vazirmatn", "Inter", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-slate-900 antialiased selection:bg-primary/20 selection:text-primary">
    <div class="relative flex min-h-screen flex-col overflow-hidden mx-auto bg-background-light shadow-2xl">
        <div class="relative h-64 w-full shrink-0">
            <div class="absolute inset-0 bg-gradient-to-t from-background-light via-background-light/20 to-transparent z-10"></div>
            <div class="w-full h-full bg-center bg-cover" data-alt="Industrial cargo container terminal at night with blue lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDr9Rxo2U5Mo9NkkSe98MDLTg508WsJS2WyWv1MHKWWSudYMHqrUKfPL4khkwXFk4w3K_bvcEdJg1Rh86ezJ-fbOu4jsTYHyejNkYyYhlizASky4xROOV0rSx9yzGmpBaCBaA2ByY39RW9hErwz42qxIapX-3QkZ1sNa-IipsiZdiSviC0zrpmb2sErymYt_aNpPyQNMGxWtgNrsz3Asw2JHb3k-j_bm7EYVKopkrAWdF3LLsytHWEJ8hYsXcB1Xc9vi5ntnGy1hKWj");'></div>
            <div class="absolute bottom-4 right-0 left-0 z-20 flex flex-col items-center justify-center p-4">
                <div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-3 shadow-lg shadow-primary/30 ring-4 ring-white/20 backdrop-blur-sm">
                    <span class="material-symbols-outlined text-white text-4xl">local_shipping</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight drop-shadow-sm">ATK Cargo</h1>
                <p class="text-sm text-slate-600 mt-1 font-medium bg-white/50 px-3 py-0.5 rounded-full backdrop-blur-md">مدیریت هوشمند فرآیند بارگیری</p>
            </div>
        </div>
        <div class="flex-1 px-6 pb-8 flex flex-col gap-6 pt-2">
            <div class="text-center mb-1">
                <h2 class="text-xl font-extrabold text-slate-900">ورود به حساب کاربری</h2>
                <p class="text-sm text-slate-500 mt-1.5">خوش آمدید! لطفاً برای ادامه وارد شوید.</p>
            </div>
            <form class="space-y-5" onsubmit="event.preventDefault();">
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 px-1">نام کاربری</label>
                    <div class="flex w-full items-stretch rounded-xl shadow-sm bg-surface-light border border-slate-200 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all overflow-hidden group">
                        <div class="flex items-center justify-center pl-3 pr-4 bg-slate-50 border-l border-slate-200 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                        <input class="flex-1 bg-transparent border-none text-right px-4 py-3.5 text-slate-900 placeholder:text-slate-400 focus:ring-0 text-base" dir="ltr" placeholder="atk..." type="text" />
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700 px-1">رمز عبور</label>
                    <div class="flex w-full items-stretch rounded-xl shadow-sm bg-surface-light border border-slate-200 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all overflow-hidden group">
                        <div class="flex items-center justify-center pl-3 pr-4 bg-slate-50 border-l border-slate-200 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined">lock</span>
                        </div>
                        <input class="flex-1 bg-transparent border-none text-right px-4 py-3.5 text-slate-900 placeholder:text-slate-400 focus:ring-0 text-base font-sans tracking-widest" dir="ltr" placeholder="••••••••" type="password" />
                        <button class="flex items-center justify-center px-4 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors" type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                </div>
                <button class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg" type="submit">
                    <span>ورود به سامانه</span>
                    <span class="material-symbols-outlined text-[22px] rtl:-scale-x-100">login</span>
                </button>
        </div>
    </div>

</body>

</html>
