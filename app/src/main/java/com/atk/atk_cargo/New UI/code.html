<!DOCTYPE html>
<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Waybill Details Dialog</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6", // Blue-500
                        "primary-soft": "#DBEAFE", // Blue-100
                        "background-light": "#E0F2FE", // Light Blueish Background
                        "card-bg": "#FFFFFF",
                        "danger": "#F43F5E", // Rose-500 for a softer red
                    },
                    fontFamily: {
                        sans: ["Vazirmatn", "sans-serif"],
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2.5rem',
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f3f4f6;
            min-height: max(884px, 100dvh);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
        }
        .tab-btn {
            position: relative;
            color: #6B7280;
            background-color: #F9FAFB;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #EFF6FF;
            color: #2563EB;
        }.tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #2563EB;
            border-top-left-radius: 2px;
            border-top-right-radius: 2px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-100/50">

</div>
</div>
<div class="px-6 pt-4 pb-2 flex justify-between items-center relative z-10">
<div class="text-xl font-extrabold text-gray-900 uppercase tracking-wide">CRISTIANA</div>
<div class="flex items-center text-gray-500 text-sm gap-1 cursor-pointer hover:bg-white/50 px-2 py-1 rounded-lg transition-colors">
<span class="material-symbols-outlined text-xl">expand_more</span>
<span>تناژ مجاز</span>
</div>
</div>
<div class="flex-1 px-5 overflow-y-auto no-scrollbar pb-24 flex flex-col">
<div class="flex flex-col items-center mt-6 mb-6">
<div class="w-24 h-24 rounded-full bg-blue-100/80 flex items-center justify-center mb-3 ring-8 ring-blue-50/50 shadow-inner">
<div class="w-14 h-14 bg-[#3B82F6] rounded-full flex items-center justify-center shadow-lg shadow-blue-500/40 text-white">
<span class="material-symbols-outlined text-[32px] font-bold">priority_high</span>
</div>
</div>
<h1 class="text-[1.6rem] font-bold text-[#2563EB] mb-1">جزئیات حواله</h1>
</div>
<div class="bg-[#DBEAFE]/40 border border-blue-200/60 rounded-2xl py-4 px-4 mb-6 flex items-center justify-between relative shadow-sm">

<span class="text-gray-900 font-bold text-lg text-center">شماره حواله: 4321</span>
</div>

</button>
</div>
<div class="bg-white rounded-[1.5rem] shadow-sm flex-1 flex flex-col overflow-hidden mb-4">
<div class="flex border-b border-gray-100 bg-gray-50/50">
<button class="tab-btn active flex-1 py-4 text-xs sm:text-sm font-bold transition-all flex flex-col items-center gap-1.5" id="tab-btn-main" onclick="switchTab('main')">
<span class="material-symbols-outlined text-[22px]">info</span>
<span>اطلاعات اصلی</span>
</button>
<button class="tab-btn flex-1 py-4 text-xs sm:text-sm font-bold transition-all flex flex-col items-center gap-1.5" id="tab-btn-weight" onclick="switchTab('weight')">
<span class="material-symbols-outlined text-[22px]">scale</span>
<span>وزن</span>
</button>
<button class="tab-btn flex-1 py-4 text-xs sm:text-sm font-bold transition-all flex flex-col items-center gap-1.5" id="tab-btn-time" onclick="switchTab('time')">
<span class="material-symbols-outlined text-[22px]">schedule</span>
<span>زمان و تاریخ</span>
</button>
</div>
<div class="p-5 flex-1 bg-white">
<div class="tab-content active space-y-5 h-full" id="tab-main">
<div class="flex justify-between items-center border-b border-gray-50 pb-3 last:border-0">

</div>

<span class="font-bold text-gray-900 text-[15px] tracking-wider">37069096</span>
</div>
</div>
</div>
<div class="tab-content h-full flex flex-col items-center justify-center text-gray-400 py-8" id="tab-weight">
<div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-5xl text-gray-300">scale</span>
</div>
<p class="text-sm font-medium text-gray-500">اطلاعات وزن در دسترس نیست</p>
</div>
<div class="tab-content h-full flex flex-col items-center justify-center text-gray-400 py-8" id="tab-time">
<div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-5xl text-gray-300">schedule</span>
</div>

</div>
<div class="absolute bottom-0 left-0 w-full p-6 bg-[#EEF6FF] z-50 border-t border-white/50 backdrop-blur-sm">
<div class="flex gap-4">
<button class="flex-[1.2] bg-[#DBEAFE] text-[#2563EB] font-bold text-lg py-4 rounded-xl hover:bg-blue-200 transition-colors shadow-sm active:scale-95 text-center">
                    بستن
                </button>
<button class="flex-1 bg-[#EF4444] text-white font-bold text-lg py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-red-600 transition-colors shadow-lg shadow-red-500/30 active:scale-95">
<span class="material-symbols-outlined text-2xl">delete</span>
<span>حذف</span>
</button>
</div>
</div>
</div>
<script>
        function switchTab(tabId) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            // Deactivate all tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            // Activate selected tab content and button
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('tab-btn-' + tabId).classList.add('active');
        }
    </script>

</body></html>
